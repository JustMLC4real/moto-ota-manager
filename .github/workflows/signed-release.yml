name: Build signed release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed release tag on the default branch
        required: true
        default: v1.0.0
        type: string
permissions:
  contents: read
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  signed-release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a reviewed tag reachable from the default branch
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" "refs/remotes/origin/$DEFAULT_BRANCH"
          python3 tools/check_public_repository.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Decode private signing material outside the checkout
        env:
          MOTO_RELEASE_KEYSTORE_BASE64: ${{ secrets.MOTO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          data = base64.b64decode(os.environ['MOTO_RELEASE_KEYSTORE_BASE64'], validate=True)
          if not 128 <= len(data) <= 65536:
              raise SystemExit('Signing keystore missing or oversized')
          destination = Path(os.environ['RUNNER_TEMP']) / 'moto-release.jks'
          descriptor = os.open(destination, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'wb') as output:
              output.write(data)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('MOTO_RELEASE_STORE_FILE=' + str(destination) + '\n')
          PY
      - name: Build signed non-debuggable release
        env:
          MOTO_RELEASE_STORE_PASSWORD: ${{ secrets.MOTO_RELEASE_STORE_PASSWORD }}
          MOTO_RELEASE_KEY_ALIAS: ${{ secrets.MOTO_RELEASE_KEY_ALIAS }}
          MOTO_RELEASE_KEY_PASSWORD: ${{ secrets.MOTO_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleSignedRelease :app:lintRelease :app:writeReleaseDependencyInventory --no-daemon --no-configuration-cache --console=plain
      - name: Verify signature, manifest, dynamic interfaces and native layout
        env:
          MOTO_RELEASE_CERT_SHA256: ${{ vars.MOTO_RELEASE_CERT_SHA256 }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 tools/verify_release_apk.py app/build/outputs/apk/release/app-release.apk --version "${RELEASE_TAG#v}" --build-tools "$ANDROID_HOME/build-tools/35.0.0" > release-verification.json
      - name: Audit resolved release dependency advisories
        run: python3 tools/audit_dependencies.py --inventory app/build/reports/dependencies/release-runtime.json --output app/build/reports/dependencies/osv-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moto-ota-manager-signed-release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/dependencies/release-runtime.json
            app/build/reports/dependencies/osv-audit.json
            release-verification.json
      - name: Remove temporary signing file
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'moto-release.jks').unlink(missing_ok=True)
          PY
